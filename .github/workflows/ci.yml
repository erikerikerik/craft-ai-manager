name: CI

# Pushes to main and every pull request. A PR branch gets one run from the pull_request event,
# so pushes to PR branches are not built twice.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # Third-party actions are pinned to full commit SHAs; the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # dtolnay/rust-toolchain v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # MG-01 brought a dependency tree, so the crates.io cache is worth having. Pinned to a full
      # SHA like the other third-party actions (v2.9.2, verified against the tag on Oct 14, 2026).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # Swatinem/rust-cache v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # MG-07: the dependency licence gate (SPEC v1.1 amendment 17). `deny.toml` lists the permissive
  # licences Erik allows; a dependency outside that list, a rustsec advisory or a duplicate version
  # fails or warns here. Pinned to a full SHA like the other third-party actions: tag v2.1.1
  # (annotated tag object c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb) points at this commit, checked
  # Oct 16, 2026; the action runs cargo-deny 0.20.2.
  deny:
    name: deny (licences, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # EmbarkStudios/cargo-deny-action v2.1.1

  # MG-07: the minimum supported Rust version builds and tests. Keep the toolchain in step with
  # `rust-version` in Cargo.toml (1.95); if a dependency needs more, raise both and say so.
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # dtolnay/rust-toolchain v1
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # Swatinem/rust-cache v2.9.2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test
