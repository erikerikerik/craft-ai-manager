# Dependency gate (MG-07). Erik's licence rule (SPEC v1.1 amendment 17, Oct 15 night): a new
# library is allowed only with a permissive licence - MIT, Apache-2.0, BSD, ISC or Zlib. The two
# Unicode licences and CDLA-Permissive-2.0 (webpki-roots, accepted in the MG-02 review) are listed
# because the current tree needs them. Anything else fails this check, and widening the list is
# Erik's call, not an agent's.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
highlight = "all"
wildcards = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The one crate this repo owns is PolyForm Noncommercial (LICENSE.md), which the rule above
# deliberately does not allow for third-party code. An exception is scoped to that crate by name,
# so a dependency carrying the same licence still fails the gate.
[[licenses.exceptions]]
name = "craft-ai-manager"
allow = ["PolyForm-Noncommercial-1.0.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []