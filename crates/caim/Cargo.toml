[package]
name = "craft-ai-manager"
description = "Craft AI Manager (CAIM): the local model runner behind PhotoCraft's AI tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "caim"
path = "src/main.rs"

[lints]
workspace = true

# MG-01 keeps this list short on purpose (SPEC amendment 11, "no new HTTP dependency" on the client
# side and the same rule here): no async runtime, no web framework, no multipart crate. The HTTP
# framing, the multipart parser and the job queue are ours, and every one of them is bounded.
[dependencies]
getrandom = "0.4"
httparse = "1.10"
# MG-04: the real LaMa runner. `ort` 2.x with its default features, which download a prebuilt ONNX
# Runtime at build time (CPU execution provider only) and run fully offline afterwards. The newest
# 2.x on crates.io is still a release candidate (2.0.0-rc.14), so the requirement names it.
ort = "2.0.0-rc.14"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
thiserror = "2.0"
toml = "1.1.8"
ureq = "3.4.2"

